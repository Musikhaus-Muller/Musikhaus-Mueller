name: Collect prices

on:
  workflow_dispatch:
    inputs:
      shop:
        description: Optional shop slug (mueller, thomann, kirstein, prolighting, hotsound)
        required: false
        type: string
      limit:
        description: Optional maximum number of offers
        required: false
        type: string
  schedule:
    - cron: '15 7 * * *'

concurrency:
  group: price-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: collector
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Collect
        run: |
          SHOP="${{ inputs.shop }}"
          LIMIT="${{ inputs.limit }}"
          ARGS=()
          if [ -n "$SHOP" ]; then ARGS+=("--shop=$SHOP"); fi
          if [ -n "$LIMIT" ]; then ARGS+=("--limit=$LIMIT"); fi
          node run.mjs "${ARGS[@]}"
