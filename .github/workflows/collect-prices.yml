name: Collect prices
run-name: Collect prices / ${{ github.event.inputs.collection_run_id || github.run_id }}

on:
  workflow_dispatch:
    inputs:
      shop:
        description: Shop to collect (choose all for every active offer)
        required: true
        default: all
        type: choice
        options:
          - all
          - mueller
          - thomann
          - kirstein
          - prolighting
          - hotsound
          - musicstore
      limit:
        description: Optional maximum number of offers
        required: false
        type: string
      collection_run_id:
        description: Existing Supabase run reserved by the website
        required: false
        type: string
  schedule:
    - cron: '15 7 * * *'

concurrency:
  group: price-update-pipeline
  cancel-in-progress: false

jobs:
  discover:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: collector
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      DISCOVERY_TRIGGER: schedule
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Discover missing PRO LIGHTING offers
        run: node discover.mjs --shop=prolighting

  collect:
    needs: discover
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: collector
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      COLLECT_TRIGGER: ${{ github.event_name == 'schedule' && 'schedule' || 'manual' }}
      COLLECT_RUN_ID: ${{ inputs.collection_run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Claim website-reserved run
        id: claim
        run: node claim-manual-run.mjs
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Collect
        id: collect
        run: |
          SHOP="${{ inputs.shop }}"
          LIMIT="${{ inputs.limit }}"
          ARGS=()
          echo "trigger=$COLLECT_TRIGGER shop=${SHOP:-all} limit=${LIMIT:-all}"
          if [ -n "$SHOP" ] && [ "$SHOP" != "all" ]; then ARGS+=("--shop=$SHOP"); fi
          if [ -n "$LIMIT" ]; then ARGS+=("--limit=$LIMIT"); fi
          node run.mjs "${ARGS[@]}"
      - name: Finalize failed manual run
        if: ${{ always() && inputs.collection_run_id != '' && steps.claim.outcome == 'success' && steps.collect.outcome != 'success' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          COLLECT_RUN_ID: ${{ inputs.collection_run_id }}
        run: node finalize-run.mjs
